    <script>
      (function () {
        try {
          var saved = localStorage.getItem('warraq-active-theme');
          document.documentElement.setAttribute('data-theme', saved || 'obsidian-ink');
          var savedLang = localStorage.getItem('warraq-active-language');
          if (savedLang === 'en' || savedLang === 'ar') {
            document.documentElement.setAttribute('lang', savedLang);
            document.documentElement.setAttribute('dir', savedLang === 'en' ? 'ltr' : 'rtl');
          }
          var savedIcon = localStorage.getItem('warraq-active-icon');
          if (savedIcon && /^[a-z0-9-]+$/i.test(savedIcon) && savedIcon !== 'classic-copper') {
            var iconEl = document.querySelector('link[rel="icon"]');
            if (iconEl) iconEl.setAttribute('href', '/api/app-icon/' + encodeURIComponent(savedIcon) + '.svg');
            var appleEl = document.querySelector('link[rel="apple-touch-icon"]');
            if (appleEl) appleEl.setAttribute('href', '/api/app-icon/' + encodeURIComponent(savedIcon) + '.png?size=180&maskable=1');
            var manEl = document.querySelector('link[rel="manifest"]');
            if (manEl) manEl.setAttribute('href', '/api/manifest.webmanifest?icon=' + encodeURIComponent(savedIcon) + (savedLang === 'en' ? '&lang=en' : ''));
          }
        } catch (e) {}
      })();
    </script>
    <style>

      #boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        box-sizing: border-box;
      }
      .boot-spinner {
        width: 44px;
        height: 44px;
        border-radius: 9999px;
        border: 3px solid rgba(154, 52, 18, 0.22);
        border-top-color: #D4AF37;
        animation: bootSpin 0.9s linear infinite;
      }
      @keyframes bootSpin {
        to { transform: rotate(360deg); }

  <body class="app-canvas-bg antialiased selection:bg-[#9A3412]/15 selection:text-[#9A3412]">
    <div id="root">
      <div id="boot-shell">
        <div class="boot-spinner" aria-hidden="true"></div>
        <h1 style="margin:18px 0 6px;font-size:28px;font-weight:700;">مكتبتي <span style="font-size:18px;opacity:0.8;">maktabty</span></h1>
        <p id="boot-status" style="margin:0;font-size:13px;opacity:0.72;">جاري تهيئة المكتبة الرقمية...</p>
        <button
          id="boot-retry"
          type="button"
          onclick="window.__maktabtyHardReload && window.__maktabtyHardReload()"
          style="display:none;margin-top:18px;padding:10px 22px;border:1px solid rgba(212,175,55,0.55);border-radius:8px;background:#D4AF37;color:#050505;font-size:13px;font-weight:700;cursor:pointer;"
        >
          إعادة فتح المكتبة
        </button>
      </div>
    </div>
    <script>
      (function () {
        var RECOVERY_KEY = 'warraq-boot-recovery-at';
        function clearSwAndCaches() {
          var jobs = [];
          try {
            if ('serviceWorker' in navigator) {
              jobs.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
            if ('caches' in window) {
              jobs.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e) {}
          return Promise.all(jobs);
        }

        window.__maktabtyHardReload = function () {
          clearSwAndCaches().finally(function () {
            try {
              var url = new URL(window.location.href);
              url.searchParams.set('_r', String(Date.now()));
              window.location.replace(url.toString());
            } catch (e) {
              window.location.reload();
            }
          });
        };

        function triggerAutoRecovery() {
          if (window.__MAKTABTY_MOUNTED__) return;
          var now = Date.now();
          var lastTry = 0;
          try {
            lastTry = Number(sessionStorage.getItem(RECOVERY_KEY) || '0');
          } catch (e) {}
          if (!lastTry || now - lastTry > 30000) {
            try { sessionStorage.setItem(RECOVERY_KEY, String(now)); } catch (e) {}
            window.__maktabtyHardReload();
            return;
          }
          var statusEl = document.getElementById('boot-status');
          var retryBtn = document.getElementById('boot-retry');
          if (statusEl) {
            var isEn = document.documentElement.getAttribute('lang') === 'en';
            statusEl.textContent = isEn
              ? 'Loading took longer than expected. Tap below to refresh cleanly.'
              : 'استغرق الفتح وقتاً أطول من المعتاد. اضغط لإعادة الفتح بشكل سليم.';
          }
          if (retryBtn) {
            var isEnBtn = document.documentElement.getAttribute('lang') === 'en';
            if (isEnBtn) retryBtn.textContent = 'Reload Library';
            retryBtn.style.display = 'inline-block';
          }
        }

        window.addEventListener('error', function (ev) {
          if (!window.__MAKTABTY_MOUNTED__ && ev && ev.target && (ev.target.tagName === 'SCRIPT' || ev.target.tagName === 'LINK')) {
            setTimeout(triggerAutoRecovery, 250);
          }
        }, true);

        setTimeout(function () {
          if (!window.__MAKTABTY_MOUNTED__) {
            triggerAutoRecovery();
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
